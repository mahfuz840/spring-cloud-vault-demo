  # ----------------------------------------- Config for minikube
  cloud:
    vault:
      host: vault.vault.svc.cluster.local
      port: 8200
      scheme: http
      authentication: kubernetes
      kubernetes:
        role: demo-app-role
        kubernetes-path: kubernetes
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kv:
        enabled: true
        backend: kvv2
        default-context: demo-app/creds
      config:
        lifecycle:
          enabled: true

  rabbitmq:
    host: my-release-rabbitmq.default.svc.cluster.local
    username: ${rabbitmq.username} # Use Vault properties
    password: ${rabbitmq.password}
    virtual-host: ${rabbitmq.virtual-host}

